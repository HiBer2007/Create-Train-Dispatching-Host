plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = project.archives_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// ── NeoForged maven 镜像（同另外两个仓库）────────────────────────────────
def neoforgeMirror = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def u = repo.url.toString()
        if (u.contains("://maven.neoforged.net")) {
            repo.url = uri(u.replace("://maven.neoforged.net", "://neoforged.forgecdn.net"))
        }
    }
}
repositories.whenObjectAdded(neoforgeMirror)
repositories.each(neoforgeMirror)
gradle.projectsEvaluated { project.repositories.each(neoforgeMirror) }

repositories {
    mavenCentral()
    // Create / Ponder / Flywheel
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net' }
    // Registrate
    maven { name = 'IThundxr'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'Devos'; url = 'https://mvn.devos.one/releases' }
}

neoForge {
    version = project.neo_version

    // ModDevGradle 不会自动创建 runClient/runServer，必须显式声明
    // 显式声明本模组占用哪个 sourceSet（ModDevGradle 用它在 run 里构建模组文件）
    mods {
        ctdhost {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    // GraalPy 不是 mod：放进 run/mods 不会被当成模组加载，也不会进 classpath。
    // 必须显式挂到运行期 classpath 上，ctdscript 才找得到 polyglot。
    runtimeOnly fileTree(dir: "libs/graalpy", include: ["*.jar"])
    // 契约层
    implementation files("libs/${project.ctdapi_jar}")

    // Create：编译期依赖，运行期由玩家安装，不打进 jar。
    //
    // ⚠ 不要在这里手写 Ponder / Catnip / Flywheel 的版本：
    // Create 的 POM 已经声明了它们（ponder-neoforge:1.0.85+mc1.21.1 等），
    // 手写会撞上 Gradle 的 capability 冲突——两边声明同一个能力、
    // 不同模块坐标，解析直接失败。
    // 用本地 jar 而不是 maven：maven.createmod.net 对 18MB 的 jar 限速到 0.03 MB/s
    // 且会中途断连重试。这条路径由 tools/fetch-create.ps1 预先准备。
    compileOnly files("libs/create-1.21.1-6.0.11-312.jar")
    // Create 的字段类型引用 catnip（Couple 等），缺了它读那些字段会「无法解引用」
    compileOnly files("libs/catnip-0.8.54.jar")
    // 部分模型（AllPartialModels.*）的类型来自 flywheel，编译期也要能看到
    compileOnly files("libs/flywheel-1.0.7-48.jar")

    // 运行时依赖：只为本地 runServer/runClient 验证用，不会打进 jar
    runtimeOnly files("libs/create-1.21.1-6.0.11-312.jar")
    runtimeOnly files("libs/flywheel-1.0.7-48.jar")
// Ponder 既要在运行期（Create 依赖它），也要在**编译期**：
    // SmartBlockEntity 实现了 ponder 的 VirtualBlockEntity 接口，
    // 只要编译期碰到 SmartBlockEntity（例如给它挂 BlockEntityBehaviour），
    // 就要求这个接口可见——否则报「找不到符号 net.createmod.ponder.api.VirtualBlockEntity」。
    compileOnly files("libs/ponder-neoforge-1.0.85+mc1.21.1.jar")
    runtimeOnly files("libs/ponder-neoforge-1.0.85+mc1.21.1.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes(
            'Specification-Title'    : project.mod_name,
            'Implementation-Version' : project.version
        )
    }
}

tasks.register('signalOverridesTest', JavaExec) {
    group = 'verification'
    description = '灯色意图：两面独立 / 缺一面不接管 / 过期失效'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.hibermod.ctdhost.tools.SignalOverridesTest'
}
tasks.register('scheduleHealthTest', JavaExec) {
    group = 'verification'
    description = '时刻表健康判定（cyclic+空表会崩 Create）'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.hibermod.ctdhost.tools.ScheduleHealthTest'
}
tasks.register('failuresTest', JavaExec) {
    group = 'verification'
    description = '被兜住的失败必须可见（首次即记、持续累加、分点统计）'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.hibermod.ctdhost.tools.FailuresTest'
}
